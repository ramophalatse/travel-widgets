<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trip Playback</title>
<meta name="theme-color" content="#0a0f14">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="assets/brand/favicon-32-dark.png">
<link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" href="assets/brand/favicon-32-light.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* TRIP PLAYBACK: a lean-back, TV-first show of the whole trip.
   Everything is sized in --u, one hundredth of a 16:9 frame that fits the
   window, so the layout holds its proportions from a laptop to a 4K set.
   Content sits inside a 5% overscan-safe margin. Always dark. */
:root{
  --bg:#0a0f14;--bg2:#0f1720;--ink:#e8eef3;--muted:#a3b3c1;--dim:#6f8191;
  --accent:#10b981;--accent2:#34d399;--sea:#38bdf8;--road:#fcd34d;
  --glass:rgba(10,16,22,.62);--line:rgba(255,255,255,.10);
  --u:min(1vw,1.7778vh);
  --sx:5vw;--sy:5vh;
  --cb-space:0px;
  --serif:'Sora',system-ui,sans-serif;--sans:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --c-intro:#94a3b8;--c-nyc1:#34d399;--c-miami:#fbbf24;--c-cruise:#38bdf8;--c-nyc2:#c4b5fd;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;}
a{color:inherit;}
body.ui-hidden,body.ui-hidden *{cursor:none !important;}

/* ── Stage and layers ─────────────────────────────────────────────── */
#stage{position:fixed;inset:0;overflow:hidden;background:#05080b;touch-action:none;}
.layer{position:absolute;inset:0;opacity:0;transform:scale(1.035);transition:opacity .95s ease,transform 1.5s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform;}
.layer.in{opacity:1;transform:none;}
.layer.out{opacity:0;transform:scale(.985);transition-duration:.8s,1.1s;pointer-events:none;}
.scene{position:absolute;inset:0;overflow:hidden;}
.safe{position:absolute;left:var(--sx);right:var(--sx);top:var(--sy);bottom:calc(var(--sy) + var(--cb-space));transition:bottom .45s ease;}

/* Staggered reveals. Delays are in seconds through --d. */
.rv{opacity:0;animation:rv-in .9s cubic-bezier(.2,.75,.2,1) forwards;animation-delay:calc(var(--d,0) * 1s);}
@keyframes rv-in{from{opacity:0;transform:translateY(calc(var(--u) * 1.8));}to{opacity:1;transform:none;}}
/* Pausing stops the scene clock, which holds Ken Burns, maps, counters, particles
   and progress. Looping CSS animations freeze with it; entrance reveals always
   finish, so a pause is a moment to read rather than a half-faded frame. */
body.paused .pl-ring,body.paused .count-pill i,body.paused .tk-card::after,body.paused .goal::after{animation-play-state:paused !important;}

/* Photos. Ken Burns is driven from the scene clock, so it pauses with it. */
.ph{position:absolute;inset:0;overflow:hidden;background:#0b1117;}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;transform-origin:50% 50%;will-change:transform;}
.ph img.ok{opacity:1;}
.ph.blur img{filter:blur(calc(var(--u) * 2.6)) brightness(.42) saturate(1.25);transform:scale(1.18);}
.ph.blur.darker img{filter:blur(calc(var(--u) * 3)) brightness(.26) saturate(1.2);}

.eyebrow{font-family:var(--mono);font-size:max(11px,calc(var(--u) * 1.05));letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);}

/* ── Loader ───────────────────────────────────────────────────────── */
#loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(80% 70% at 50% 40%,#10202a 0%,#0a0f14 60%,#06090c 100%);transition:opacity .8s ease;}
#loader.gone{opacity:0;pointer-events:none;}
.ld{display:grid;justify-items:center;gap:calc(var(--u) * 1.6);text-align:center;}
.ld-mark{position:relative;width:calc(var(--u) * 9);height:calc(var(--u) * 9);display:grid;place-items:center;}
.ld-mark img{height:52%;width:auto;filter:drop-shadow(0 0 calc(var(--u)*1.2) rgba(52,211,153,.35));}
.ld-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,var(--accent2) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 1.3s linear infinite;}
@keyframes spin{to{transform:rotate(1turn);}}
.ld-title{font-family:var(--serif);font-weight:700;font-size:max(18px,calc(var(--u) * 2.4));letter-spacing:-.02em;}
.ld-status{font-size:max(13px,calc(var(--u) * 1.2));color:var(--muted);min-height:1.4em;}
.ld-status a{color:var(--accent2);}

/* ── Title ────────────────────────────────────────────────────────── */
.s-title .ph{transition:opacity 2.2s ease;}
.s-title .ph.dim{opacity:0;}
.t-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,11,.55) 0%,rgba(5,8,11,.05) 30%,rgba(5,8,11,.45) 60%,rgba(5,8,11,.92) 100%),linear-gradient(90deg,rgba(5,8,11,.7) 0%,rgba(5,8,11,0) 65%);}
.t-wrap{position:absolute;left:var(--sx);right:var(--sx);bottom:calc(var(--sy) + var(--cb-space));transition:bottom .45s ease;}
.t-brand{display:flex;align-items:center;gap:calc(var(--u) * 1.2);margin-bottom:calc(var(--u) * 1.6);}
.t-brand img{height:calc(var(--u) * 3.2);width:auto;}
.t-title{font-family:var(--serif);font-weight:800;font-size:calc(var(--u) * 6.4);line-height:1.02;letter-spacing:-.045em;margin:0 0 calc(var(--u) * 1.6);max-width:78vw;text-wrap:balance;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*3) rgba(0,0,0,.45);}
.t-title em{font-style:italic;color:var(--accent2);}
.t-names{font-family:var(--serif);font-weight:600;font-size:calc(var(--u) * 2.1);letter-spacing:-.01em;color:#fff;margin-bottom:calc(var(--u) * .9);}
.t-dates{font-family:var(--mono);font-size:calc(var(--u) * 1.3);color:var(--muted);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:calc(var(--u) * 1.2);align-items:center;}
.count-pill{display:inline-flex;align-items:center;gap:calc(var(--u) * .8);padding:calc(var(--u) * .5) calc(var(--u) * 1.2);border-radius:999px;background:rgba(16,185,129,.16);border:1px solid rgba(52,211,153,.38);color:#d1fae5;font-family:var(--sans);font-weight:600;font-size:calc(var(--u) * 1.3);letter-spacing:0;}
.count-pill i{width:calc(var(--u) * .7);height:calc(var(--u) * .7);border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:dot-pulse 2s ease-out infinite;}
@keyframes dot-pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7);}100%{box-shadow:0 0 0 calc(var(--u)*1.1) rgba(52,211,153,0);}}
.t-actions{display:flex;flex-wrap:wrap;gap:calc(var(--u) * 1.1);margin-top:calc(var(--u) * 2.6);transition:opacity .5s ease,transform .5s ease;}
body.playing .t-actions{opacity:0;transform:translateY(calc(var(--u)*1));pointer-events:none;}
.t-hint{margin-top:calc(var(--u) * 1.4);font-size:max(11px,calc(var(--u) * 1));color:var(--dim);transition:opacity .5s;}
body.playing .t-hint{opacity:0;}
.big-btn{display:inline-flex;align-items:center;gap:calc(var(--u) * 1);height:max(44px,calc(var(--u) * 4.4));padding:0 calc(var(--u) * 2.2);border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(10,16,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-family:var(--sans);font-weight:600;font-size:max(14px,calc(var(--u) * 1.4));cursor:pointer;transition:background .2s,border-color .2s,transform .2s;text-decoration:none;white-space:nowrap;}
.big-btn:hover,.big-btn:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);outline:none;transform:translateY(-1px);}
.big-btn:focus-visible{box-shadow:0 0 0 3px rgba(52,211,153,.55);}
.big-btn svg{width:1.15em;height:1.15em;flex-shrink:0;}
.big-btn small{font-family:var(--mono);font-weight:400;font-size:.78em;opacity:.7;margin-left:.2em;}
.big-btn.primary{background:var(--accent);border-color:var(--accent);color:#03130d;}
.big-btn.primary:hover,.big-btn.primary:focus-visible{background:var(--accent2);border-color:var(--accent2);}
.big-btn.primary small{opacity:.75;}
.big-btn[hidden]{display:none;}

/* ── Route map ────────────────────────────────────────────────────── */
.map-bg{position:absolute;inset:0;background:radial-gradient(90% 80% at 40% 35%,#0f1d27 0%,#09121a 55%,#05080c 100%);}
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.map-svg .land{fill:#162430;stroke:rgba(110,231,183,.22);stroke-width:1;vector-effect:non-scaling-stroke;}
.map-svg .grat{fill:none;stroke:rgba(255,255,255,.05);stroke-width:1;vector-effect:non-scaling-stroke;}
.seg{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.seg.k-flight{stroke:var(--accent2);stroke-width:3.2;stroke-dasharray:12 10;color:var(--accent2);}
.seg.k-sea{stroke:var(--sea);stroke-width:4.6;stroke-dasharray:.1 10;color:var(--sea);}
.seg.k-road{stroke:var(--road);stroke-width:2.4;color:var(--road);}
.seg.ghost{opacity:.17;filter:none;}
.seg.live{filter:drop-shadow(0 0 5px currentColor);}
.sm .seg.k-flight{stroke-width:2.6;stroke-dasharray:9 8;}
.sm .seg.k-sea{stroke-width:4;stroke-dasharray:.1 8;}
.pl{opacity:0;transition:opacity .6s ease;}
.pl.on{opacity:1;}
.minor-off .pl.minor{opacity:0;}
.pl-dot{fill:#fff;stroke:rgba(5,10,14,.9);stroke-width:2.5;}
.pl-ring{fill:none;stroke:var(--accent2);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center;}
.pl.ping .pl-ring{animation:ring 1.6s ease-out 2;}
@keyframes ring{0%{opacity:.95;transform:scale(1);}100%{opacity:0;transform:scale(5);}}
.pl-name{font-family:var(--serif);font-weight:700;font-size:30px;fill:#fff;paint-order:stroke;stroke:rgba(5,10,14,.9);stroke-width:7px;stroke-linejoin:round;letter-spacing:-.01em;transition:transform .6s cubic-bezier(.2,1.4,.4,1);transform:translateY(8px);}
.pl.on .pl-name{transform:none;}
.pl-sub{font-family:var(--mono);font-size:19px;fill:var(--accent2);paint-order:stroke;stroke:rgba(5,10,14,.9);stroke-width:6px;letter-spacing:.12em;}
.sm .pl-name{font-size:27px;}
.pl.here .pl-dot{fill:var(--accent2);}
.pl.here .pl-ring{animation:ring 2.2s ease-out infinite;}
.tip{fill:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.9));opacity:0;transition:opacity .3s;}
.tip.on{opacity:1;}
.route-head{position:absolute;left:0;top:0;}
.route-fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,8,11,.78) 0%,rgba(5,8,11,0) 24%,rgba(5,8,11,0) 74%,rgba(5,8,11,.7) 100%);}
.route-title{font-family:var(--serif);font-weight:800;font-size:calc(var(--u) * 3.6);letter-spacing:-.04em;margin:calc(var(--u)*.6) 0 0;line-height:1.05;}
.route-stats{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u) * 1.2);}
.stat{padding:calc(var(--u) * 1.3) calc(var(--u) * 1.6);border-radius:calc(var(--u) * 1.2);}
.stat b{display:block;font-family:var(--serif);font-weight:800;font-size:calc(var(--u) * 3.8);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:#fff;}
.stat span{display:block;margin-top:calc(var(--u) * .6);font-family:var(--mono);font-size:calc(var(--u) * 1);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.legend{position:absolute;right:0;top:calc(var(--u) * .6);display:flex;gap:calc(var(--u) * 1.8);font-family:var(--mono);font-size:calc(var(--u) * 1);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:calc(var(--u) * .7);}
.legend svg{width:calc(var(--u) * 3);height:calc(var(--u) * 1);}

/* ── Leg chapter ──────────────────────────────────────────────────── */
.leg-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,11,.6) 0%,rgba(5,8,11,.1) 35%,rgba(5,8,11,.55) 65%,rgba(5,8,11,.94) 100%),linear-gradient(90deg,rgba(5,8,11,.65) 0%,rgba(5,8,11,0) 60%);}
.ghost{position:absolute;left:var(--sx);top:calc(var(--sy) - var(--u) * 1.2);font-family:var(--serif);font-weight:800;font-style:italic;font-size:calc(var(--u) * 14);line-height:1;letter-spacing:-.05em;white-space:nowrap;background-image:linear-gradient(135deg,rgba(255,255,255,0) 0%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.5;pointer-events:none;will-change:transform;}
.leg-text{position:absolute;left:0;bottom:0;max-width:52vw;}
.leg-chapter{display:flex;align-items:center;gap:calc(var(--u)*1);}
.leg-emoji{font-size:calc(var(--u) * 3);line-height:1;margin-bottom:calc(var(--u)*1);}
.leg-place{font-family:var(--serif);font-weight:800;font-size:calc(var(--u) * 6.2);letter-spacing:-.045em;line-height:1;margin:calc(var(--u)*.8) 0 calc(var(--u) * 1.4);text-wrap:balance;}
.leg-meta{display:flex;flex-wrap:wrap;gap:calc(var(--u) * .8);margin-bottom:calc(var(--u) * 1.4);}
.leg-meta span{display:inline-flex;align-items:center;gap:calc(var(--u)*.6);padding:calc(var(--u) * .5) calc(var(--u) * 1.1);border-radius:999px;font-size:calc(var(--u) * 1.25);font-weight:500;}
.leg-meta svg{width:1.1em;height:1.1em;opacity:.8;}
.leg-intro{font-size:calc(var(--u) * 1.45);line-height:1.5;color:rgba(255,255,255,.8);max-width:46vw;margin:0;}
.inset{position:absolute;right:0;bottom:0;width:calc(var(--u) * 36);height:calc(var(--u) * 22.5);border-radius:calc(var(--u) * 1.4);overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.55);}
.inset .map-bg{background:radial-gradient(120% 120% at 30% 20%,#112330 0%,#08111a 70%);}
.inset-tag{position:absolute;left:calc(var(--u)*1.2);top:calc(var(--u)*1);font-family:var(--mono);font-size:calc(var(--u)*.9);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);z-index:2;}

/* ── Day title ────────────────────────────────────────────────────── */
.day-tint{position:absolute;inset:0;background:linear-gradient(115deg,rgba(6,20,16,.55) 0%,rgba(5,8,11,.2) 50%,rgba(5,8,11,.6) 100%);}
.festive-art{position:absolute;left:0;right:0;top:0;width:100%;height:auto;max-height:42vh;object-fit:cover;object-position:top;opacity:.92;pointer-events:none;-webkit-mask:linear-gradient(180deg,#000 55%,transparent 100%);mask:linear-gradient(180deg,#000 55%,transparent 100%);}
.day-grid{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;gap:calc(var(--u) * 4);align-items:center;}
.day-left{align-self:center;}
.day-eyebrow{display:flex;gap:calc(var(--u)*1.2);align-items:center;}
.day-num{font-family:var(--serif);font-weight:800;font-size:calc(var(--u) * 15);line-height:.86;letter-spacing:-.06em;margin:calc(var(--u)*.8) 0 calc(var(--u)*1.2);display:flex;align-items:baseline;gap:calc(var(--u)*1.2);}
.day-num small{font-size:.22em;letter-spacing:-.01em;font-weight:700;color:var(--accent2);}
.day-date{font-family:var(--serif);font-weight:600;font-size:calc(var(--u) * 2.3);letter-spacing:-.02em;color:#fff;}
.day-title{font-family:var(--sans);font-weight:500;font-size:calc(var(--u) * 2);line-height:1.3;color:rgba(255,255,255,.82);margin:calc(var(--u)*1) 0 0;max-width:44vw;text-wrap:balance;}
.occasion svg{width:1.15em;height:1.15em;flex-shrink:0;}
.occasion{display:inline-flex;white-space:nowrap;align-items:center;gap:calc(var(--u)*.6);margin-top:calc(var(--u) * 1.6);padding:calc(var(--u)*.55) calc(var(--u)*1.3);border-radius:999px;background:rgba(16,185,129,.18);border:1px solid rgba(52,211,153,.4);font-weight:600;font-size:calc(var(--u) * 1.3);color:#d1fae5;}
.day-right{display:grid;gap:calc(var(--u) * 1.6);align-content:center;}
.day-map{position:relative;height:calc(var(--u) * 21);border-radius:calc(var(--u) * 1.4);overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.45);}
.day-map .map-bg{background:radial-gradient(120% 120% at 30% 20%,#112330 0%,#08111a 70%);}
.preview{list-style:none;margin:0;padding:calc(var(--u)*1.2) calc(var(--u)*1.6);border-radius:calc(var(--u) * 1.4);display:grid;gap:calc(var(--u)*.35);}
.preview li{display:grid;grid-template-columns:calc(var(--u) * 7.8) 1fr auto;gap:calc(var(--u)*1);align-items:baseline;font-size:calc(var(--u) * 1.35);line-height:1.35;}
.preview .p-time{font-family:var(--mono);font-size:.82em;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview .p-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.9);}
.preview .p-ico svg{width:1em;height:1em;color:var(--accent2);vertical-align:-.12em;}
.preview .p-more{display:block;color:var(--muted);font-size:calc(var(--u)*1.15);padding-top:calc(var(--u)*.3);}

/* ── Stories progress ─────────────────────────────────────────────── */
#stories{position:fixed;left:var(--sx);right:var(--sx);top:var(--sy);z-index:20;opacity:0;transition:opacity .5s ease;pointer-events:none;}
#stories.on{opacity:1;}
.st-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:max(11px,calc(var(--u) * 1));letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:calc(var(--u)*.7);text-shadow:0 1px 6px rgba(0,0,0,.7);}
.st-bars{display:flex;gap:calc(var(--u) * .35);}
.st-bar{flex:1;height:max(3px,calc(var(--u) * .3));border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.35);}
.st-bar i{display:block;height:100%;width:0;background:#fff;border-radius:inherit;}
.st-bar.done i{width:100%;}

/* ── Stops ────────────────────────────────────────────────────────── */
.scrim-bl{position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,7,10,.92) 0%,rgba(4,7,10,.55) 32%,rgba(4,7,10,0) 62%),linear-gradient(90deg,rgba(4,7,10,.6) 0%,rgba(4,7,10,0) 58%),linear-gradient(180deg,rgba(4,7,10,.45) 0%,rgba(4,7,10,0) 16%);}
.st-text{position:absolute;left:0;bottom:0;max-width:60vw;}
.st-time{font-family:var(--mono);font-weight:500;font-size:calc(var(--u) * 1.5);letter-spacing:.06em;color:var(--accent2);margin-bottom:calc(var(--u)*.8);text-shadow:0 1px 8px rgba(0,0,0,.6);}
.st-title{font-family:var(--serif);font-weight:800;font-size:calc(var(--u) * 4.6);line-height:1.04;letter-spacing:-.04em;margin:0;text-wrap:balance;text-shadow:0 calc(var(--u)*.3) calc(var(--u)*2.5) rgba(0,0,0,.45);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.st-title.long{font-size:calc(var(--u) * 3.7);}
.st-title.xlong{font-size:calc(var(--u) * 3.1);}
.st-sub{font-weight:500;font-size:calc(var(--u) * 1.9);line-height:1.3;color:rgba(255,255,255,.85);margin-top:calc(var(--u)*.9);text-wrap:balance;}
.st-note{font-size:calc(var(--u) * 1.45);line-height:1.52;color:rgba(255,255,255,.8);margin:calc(var(--u)*1.3) 0 0;max-width:48vw;text-wrap:pretty;}

/* ── Image decoding ─────────────────────────────────────────────────── */
const IMG = new Map();

    .then(() => { e.ok = true; e.w = img.naturalWidth; }, () => { e.ok = !!(img.complete && img.naturalWidth); e.w = img.naturalWidth || 0; })
    .then(() => { e.pending = false; return e; });

}
function prepare(sc) {

  switch (sc.type) {

    case 'leg': jobs.push(decode(sc.leg.hero)); break;
    case 'day': jobs.push(decode(sc.day.photo)); if (sc.day.festive) jobs.push(decode(ASSET + FESTIVE_ART[sc.day.festive])); break;
    case 'stop': {
      const s = sc.stop;
      if (s.ticket) { jobs.push(decode(s.ticket.art)); break; }
      if (s.flight) { jobs.push(decode(s.flight.logo)); jobs.push(decode(s.thumb || s.sharp || sc.recent)); break; }
      if (s.sharp) jobs.push(decode(s.sharp).then(r => r.ok ? r : decode(s.thumb)));
      else if (s.thumb) jobs.push(decode(s.thumb));
      else if (sc.recent) jobs.push(decode(sc.recent));

}

  if (s.sharp && (!a || a.pending)) return { kind: 'large', src: s.sharp };
  if (a && a.ok && (!b || !b.ok || a.w >= b.w)) return { kind: 'small', src: s.sharp };

  const saved = store.get(KEYS.pos, null);

function countdown(now = new Date()) {

function routePlan() {

}
function buildRoute() {
  const m = S.model;
  const el = h(`<div class="scene s-route"><div class="map-bg"></div></div>`);
  const W = 1920, H = 1080, map = createMap(W, H);
  el.appendChild(map.svg);
  el.insertAdjacentHTML('beforeend', `<div class="route-fade"></div><div class="safe">
      <div class="route-head"><div class="eyebrow rv" style="--d:.2">The journey</div><h2 class="route-title rv" style="--d:.35">Around the world and home again</h2></div>
      ${legendHTML()}
      <div class="route-stats">

  const regionSegs = ROUTE_GEO.filter((g, i) => i >= ROUTE_GEO.findIndex(x => x.zoom === 'region') && i < ROUTE_GEO.findIndex(x => x.zoom === 'full'));

  const plan = routePlan();
  const labelled = {};
  ROUTE_GEO.forEach(g => [g.from, g.to].forEach(id => { if (PLACES[id].label !== false && !labelled[id]) labelled[id] = map.place(id); }));
  const stat = k => $(`[data-s="${k}"]`, el);

function legIcon(i, t) { if (/sunrise|sunset/i.test(t)) return ICON.sun; if (/nights?\b/i.test(t)) return ICON.moon; return i === 0 ? ICON.cal : i === 1 ? ICON.bed : ICON.cal; }

  if (intro.length) groups.push({ label: 'Start', c: 'var(--c-intro)', a: 0, b: S.starts[intro[intro.length - 1].idx] + effDur(intro[intro.length - 1]) });
  m.legs.forEach(leg => {
    const idx = S.scenes.filter(s => s.leg === leg).map(s => s.idx); if (!idx.length) return;
    const a = S.starts[idx[0]], z = idx[idx.length - 1];
    groups.push({ label: leg.emoji + ' ' + leg.name, c: `var(--c-${leg.id}, var(--c-intro))`, a, b: S.starts[z] + effDur(S.scenes[z]) });
  });
  const fin = S.scenes[S.scenes.length - 1];
  groups.push({ label: 'End', c: 'var(--c-intro)', a: S.starts[fin.idx], b: T });
  const gap = .25;
  tlTrack.innerHTML = groups.map(g => {
    const left = g.a / T * 100, w = (g.b - g.a) / T * 100;
    return `<div class="tl-ch" style="--c:${g.c};left:calc(${left}% + ${gap}px);width:calc(${w}% - ${gap * 2}px)"><i></i></div>`;
  }).join('') + groups.map(g => { const left = g.a / T * 100, w = (g.b - g.a) / T * 100; return w > 6 ? `<div class="tl-lab" style="--c:${g.c};left:${left}%;max-width:${w}%">${esc(g.label)}</div>` : ''; }).join('')
    + S.dayAnchors.map(i => `<div class="tl-tick" style="left:${S.starts[i] / T * 100}%"></div>`).join('');
  chapters = groups.map((g, k) => ({ g, el: tlTrack.children[k].firstChild }));
  tl.setAttribute('aria-valuemax', String(Math.round(T)));
}
function paintProgress(u) {
  if (!S.scenes.length) return;
  const T = S.total || 1, now = S.starts[S.i] + Math.min(S.t, effDur(S.scenes[S.i]));
  tlHead.style.left = (now / T * 100) + '%';
  chapters.forEach(c => { c.el.style.width = (clamp((now - c.g.a) / ((c.g.b - c.g.a) || 1)) * 100) + '%'; });
  const txt = '<b>' + fmtTime(now) + '</b> / ' + fmtTime(T);
  if (tEl.innerHTML !== txt) tEl.innerHTML = txt;
  tl.setAttribute('aria-valuenow', String(Math.round(now)));
  const k = storyList.indexOf(S.i);
  if (k >= 0 && stBars.children[k]) stBars.children[k].firstChild.style.width = (u * 100).toFixed(2) + '%';
}
function tlTime(e) { const r = tlTrack.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * S.total; }
function tipFor(T) {
  const sc = S.scenes[sceneAtTime(T)];
  const d = sc && sc.day;
  return d ? `<b>Day ${esc(d.num)}</b>${esc(d.dateShort)} · ${esc(d.title)}` : `<b>${fmtTime(T)}</b>${esc(sceneLabel(sc))}`;
}
let dragging = false;
tl.addEventListener('pointermove', e => {
  if (!S.scenes.length) return;
  const r = tlTrack.getBoundingClientRect(), T = tlTime(e);
  tlTip.innerHTML = tipFor(T);
  const w = tlTip.offsetWidth, x = clamp(e.clientX - r.left, w / 2, r.width - w / 2);
  tlTip.style.left = x + 'px';
  if (dragging) tlHead.style.left = (T / S.total * 100) + '%';
});
tl.addEventListener('pointerdown', e => { if (!S.scenes.length) return; dragging = true; tl.classList.add('drag'); tl.setPointerCapture(e.pointerId); e.preventDefault(); });
tl.addEventListener('pointerup', e => { if (!dragging) return; dragging = false; tl.classList.remove('drag'); go(sceneAtTime(tlTime(e))); });
tl.addEventListener('pointercancel', () => { dragging = false; tl.classList.remove('drag'); });
tl.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.stopPropagation(); e.preventDefault(); (e.key === 'ArrowLeft' ? prev : next)(); } });

function syncPlayButton() {
  const b = $('#btn-play');
  b.innerHTML = S.playing ? ICON.pause : ICON.play;
  b.setAttribute('aria-label', S.playing ? 'Pause' : 'Play'); b.title = (S.playing ? 'Pause' : 'Play') + ' (Space)';
}
function syncToggles() {
  $('#m-full').classList.toggle('on', S.mode === 'full'); $('#m-hl').classList.toggle('on', S.mode === 'highlights');
  $('#m-full').setAttribute('aria-pressed', S.mode === 'full'); $('#m-hl').setAttribute('aria-pressed', S.mode === 'highlights');
  $('#btn-speed').textContent = SPEEDS[S.speedIdx].label + ' ' + SPEEDS[S.speedIdx].v + 'x';
  const c = $('#btn-costs'); c.classList.toggle('on', S.costs); c.setAttribute('aria-pressed', S.costs);
  const fs = !!document.fullscreenElement, f = $('#btn-fs'); f.innerHTML = fs ? ICON.fsOut : ICON.fsIn; f.setAttribute('aria-label', fs ? 'Exit fullscreen' : 'Fullscreen');
}
let toastT = 0;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }

/* Auto-hiding controls. Content makes room for the bar while it is up. */
let idleT = 0, overControls = false;
function setSpace() { const shown = !body.classList.contains('ui-hidden') && !body.classList.contains('loading'); document.documentElement.style.setProperty('--cb-space', shown ? Math.round($('#controls').offsetHeight + innerHeight * .015) + 'px' : '0px'); }
function poke() {
  body.classList.remove('ui-hidden'); setSpace();
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (S.playing && !overviewOpen() && !overControls && !dragging) { body.classList.add('ui-hidden'); setSpace(); } }, 3500);
}
$('#controls').addEventListener('pointerenter', () => { overControls = true; poke(); });
$('#controls').addEventListener('pointerleave', () => { overControls = false; poke(); });
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') poke(); }, { passive: true });
addEventListener('resize', () => setSpace());

/* Fullscreen and wake lock */
function enterFS() { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); }
function toggleFS() { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else enterFS(); }
document.addEventListener('fullscreenchange', () => { syncToggles(); setTimeout(setSpace, 300); });
let wake = null;
async function lockOn() {
  if (!('wakeLock' in navigator) || wake || document.visibilityState !== 'visible') return;
  try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } catch (e) { wake = null; }
}
function lockOff() { if (wake) { wake.release().catch(() => {}); wake = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.playing) lockOn(); });

/* ── Overview ───────────────────────────────────────────────────────── */
const ov = $('#overview'), ovBody = $('#ov-body');
const overviewOpen = () => ov.classList.contains('open');
function buildOverview() {
  const m = S.model;
  const tile = (key, label, title, img, cls = '') => `<button class="ov-tile ${cls}${img ? '' : ' plain'}" data-go="${esc(key)}">${img ? `<img loading="lazy" decoding="async" alt="" src="${esc(img)}">` : ''}<span><span class="o-day">${esc(label)}</span><span class="o-title">${esc(title)}</span></span></button>`;
  let html = `<section class="ov-sec" style="--c:var(--c-intro)"><h3><span class="dot"></span>Start<small>${fmtRun(S.total)} in ${S.mode === 'highlights' ? 'Highlights' : 'Full'}</small></h3><div class="ov-grid">
    ${tile('title', 'Start', 'Title', m.legs[0] && m.legs[0].hero)}${tile('route', 'The journey', 'The whole route on the map', '')}${tile('finale', 'The end', 'By the numbers', '')}</div></section>`;
  m.legs.forEach(leg => {
    html += `<section class="ov-sec" style="--c:var(--c-${leg.id}, var(--c-intro))"><h3><span class="dot"></span>${esc(leg.emoji)} ${esc(leg.name)}<small>${esc(leg.meta[0] || '')}</small></h3><div class="ov-grid">`;
    html += tile('leg:' + leg.id, 'Chapter ' + (leg.idx + 1), leg.place, leg.hero);
    leg.days.filter(d => !d.dup).forEach(d => { html += tile('day:' + d.key, 'Day ' + d.num + ' · ' + d.dateShort, d.title, d.stops.map(s => s.thumb).find(Boolean) || d.photo); });
    html += '</div></section>';
  });
  ovBody.innerHTML = html;
}
function openOverview() {
  if (!S.model) return;
  ov.classList.add('open'); ov.setAttribute('aria-hidden', 'false');
  body.classList.remove('ui-hidden');
  const sc = S.scenes[S.i];
  const key = sc.type === 'stop' ? (sc.day.dup ? 'leg:' + sc.leg.id : 'day:' + sc.day.key) : sc.key;
  $$('.ov-tile', ovBody).forEach(t => t.classList.toggle('current', t.dataset.go === key));
  const cur = $('.ov-tile.current', ovBody) || $('.ov-tile', ovBody);
  if (cur) { cur.scrollIntoView({ block: 'center' }); cur.focus({ preventScroll: true }); }
}
function closeOverview() { ov.classList.remove('open'); ov.setAttribute('aria-hidden', 'true'); poke(); }
ovBody.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (!t) return;
  const i = findSceneByKey(t.dataset.go);
  closeOverview();
  if (i >= 0) { go(i); play(); }
});

/* ── Input ──────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (e.detail) b.blur();
  switch (act) {
    case 'toggle': togglePlay(); break;
    case 'prev': prev(); break;
    case 'next': next(); break;
    case 'prevDay': prevDay(); break;
    case 'nextDay': nextDay(); break;
    case 'mode-full': setMode('full'); break;
    case 'mode-highlights': setMode('highlights'); break;
    case 'speed': cycleSpeed(); break;
    case 'costs': toggleCosts(); break;
    case 'overview': openOverview(); break;
    case 'closeOverview': closeOverview(); break;
    case 'fullscreen': toggleFS(); break;
    case 'playTrip': enterFS(); setMode('full', true); go(0, { instant: true }); play(); break;
    case 'playHighlights': enterFS(); setMode('highlights', true); go(0, { instant: true }); play(); break;
    case 'resume': { const saved = store.get(KEYS.pos, null); const i = saved ? findSceneByKey(saved.key) : -1; enterFS(); go(i > 0 ? i : 0); play(); break; }
    case 'replay': go(0); play(); break;
  }
});
addEventListener('keydown', e => {
  if (!S.model || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (overviewOpen()) {
    if (k === 'Escape' || k === 'o' || k === 'O') { e.preventDefault(); closeOverview(); }
    return;
  }
  poke();
  const map = {
    ' ': togglePlay, k: togglePlay, K: togglePlay,
    ArrowLeft: prev, ArrowRight: next, ArrowUp: prevDay, ArrowDown: nextDay,
    PageUp: prevLeg, PageDown: nextLeg, Home: restart,
    o: openOverview, O: openOverview, f: toggleFS, F: toggleFS, c: toggleCosts, C: toggleCosts,
    h: () => setMode(S.mode === 'full' ? 'highlights' : 'full'), H: () => setMode(S.mode === 'full' ? 'highlights' : 'full')
  };
  if (map[k]) { e.preventDefault(); map[k](); }
});
// Touch: thirds and swipes. Mouse: a click on the picture plays or pauses.
let down = null;
stage.addEventListener('pointerdown', e => { if (e.target.closest('button,a')) { down = null; return; } down = { x: e.clientX, y: e.clientY, t: performance.now(), type: e.pointerType }; });
stage.addEventListener('pointerup', e => {
  if (!down || !S.model) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, quick = performance.now() - down.t < 500, type = down.type; down = null;
  const idleTitle = S.scenes[S.i].type === 'title' && !S.playing;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.3) { (dx < 0 ? next : prev)(); poke(); return; }
  if (!quick || Math.hypot(dx, dy) > 12) return;
  if (type === 'mouse') { if (!idleTitle) togglePlay(); poke(); return; }
  const x = e.clientX / innerWidth;
  if (x < 1 / 3) prev();
  else if (x > 2 / 3) next();
  else if (body.classList.contains('ui-hidden')) poke();
  else { body.classList.add('ui-hidden'); setSpace(); }
});

/* ── Deep links ─────────────────────────────────────────────────────── */
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('scene')) return p.get('scene');
  if (p.get('day')) return 'day:' + p.get('day');
  if (p.get('leg')) return 'leg:' + p.get('leg');
  if (p.get('stop')) return 'stop:' + p.get('stop');
  return '';
}
function resolveHashKey(key) {
  if (!key) return -1;
  let i = findSceneByKey(key);
  if (i < 0 && key.startsWith('day:')) { const dk = key.slice(4); i = S.scenes.findIndex(s => s.day && s.day.key === dk); if (i > 0 && S.scenes[i - 1].type === 'leg') i--; }
  return i;
}
let lastHash = '';
function writeHash(sc) {
  let hsh = '';
  if (sc.type === 'leg') hsh = '#leg=' + sc.leg.id;
  else if (sc.day) hsh = '#day=' + sc.day.key;
  else if (sc.type === 'route' || sc.type === 'finale') hsh = '#scene=' + sc.key;
  if (hsh === lastHash) return; lastHash = hsh;
  try { history.replaceState(null, '', hsh || (location.pathname + location.search)); } catch (e) { /* sandboxed */ }
}
addEventListener('hashchange', () => { const i = resolveHashKey(readHash()); if (i >= 0 && i !== S.i) go(i); });

/* ── Start ──────────────────────────────────────────────────────────── */
async function main() {
  requestAnimationFrame(frame);
  loadLand().catch(e => console.info('[playback] map land unavailable, drawing points and arcs only', e && e.message));
  let res;
  try { res = await loadModel(); }
  catch (e) {
    setStatus('');
    ldStatus.innerHTML = 'The itinerary did not load. <a href="">Try again</a> or <a href="trip-itinerary.html">open the itinerary</a>.';
    $('.ld-ring').style.animation = 'none';
    return;
  }
  S.model = res.model;
  // Photos are plain URLs once read, so the page behind them can go and free
  // its memory. Blob URLs belong to that page, so keep it if any are in use.
  if (!res.model.blob) res.frame.remove();
  if (!S.model.legs.length) { ldStatus.innerHTML = 'No days found in the itinerary. <a href="trip-itinerary.html">Open the itinerary</a>.'; return; }
  S.scenes = buildScenes(S.mode); layoutTimeline(); buildTimelineUI(); buildOverview(); syncToggles(); syncPlayButton();
  body.classList.remove('loading');
  const start = resolveHashKey(readHash());
  await prepare(S.scenes[start > 0 ? start : 0]).catch(() => {});
  $('#loader').classList.add('gone');
  setTimeout(() => $('#loader').remove(), 900);
  setSpace();
  if (start > 0) { await go(start, { instant: true }); play(); }
  else go(0, { instant: true });
  window.__playback = { S, go, play, pause, setMode, scenes: () => S.scenes, model: () => S.model, total: mode => totalFor(buildScenes(mode)) };
}
main();
})();
</script>
</body>
